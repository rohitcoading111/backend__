<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Class Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 16px;
      background: #f4f6f8;
    }

    .controls {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    input, select, button {
      padding: 12px;
      font-size: 15px;
      box-sizing: border-box;
      width: 100%;
    }

    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.6; }

    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .video-card {
      background: #111827;
      color: white;
      padding: 12px;
      border-radius: 10px;
      min-width: 0;
    }

    video {
      width: 100%;
      min-height: 220px;
      background: black;
      object-fit: contain;
    }

    #status {
      padding: 12px;
      background: white;
      margin: 16px 0;
      overflow-wrap: anywhere;
    }

    .hint {
      color: #475569;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>Live Class Test</h1>

  <div class="controls">
    <label>
      Role
      <select id="role">
        <option value="INSTRUCTOR">Instructor</option>
        <option value="STUDENT">Student</option>
      </select>
    </label>

    <label>
      Backend JWT Token
      <input id="authToken" type="password"
        placeholder="Paste logged-in user's JWT" autocomplete="off" />
    </label>

    <label>
      Course ID (Instructor)
      <input id="courseId" placeholder="Published course ID" />
    </label>

    <label>
      Session ID (Student / End Live)
      <input id="sessionId" placeholder="Live session ID" />
    </label>

    <button id="startLiveBtn">Start Live (Instructor)</button>
    <button id="joinLiveBtn">Get Join Access (Student)</button>

    <hr />

    <label>
      LiveKit WebSocket URL
      <input id="serverUrl" placeholder="wss://your-project.livekit.cloud" />
    </label>

    <label>
      LiveKit access token
      <input id="token" type="password" placeholder="Generated by backend" autocomplete="off" />
    </label>

    <button id="connectBtn">Connect Camera / Join Class</button>
    <button id="leaveBtn" disabled>Leave Class</button>
    <button id="endLiveBtn">End Live (Instructor)</button>
  </div>

  <p class="hint">
    Instructor: Start Live → Connect Camera. Student: enter session ID →
    Get Join Access → Connect Camera / Join Class.
  </p>

  <div id="status">Not connected</div>
  <div class="videos" id="videos"></div>

  <script type="module">
    import {
      Room,
      RoomEvent,
      Track
    } from "https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.esm.mjs";

    const API_URL = "http://localhost:3000/api";

    const role = document.getElementById("role");
    const authTokenInput = document.getElementById("authToken");
    const courseIdInput = document.getElementById("courseId");
    const sessionIdInput = document.getElementById("sessionId");
    const serverUrl = document.getElementById("serverUrl");
    const tokenInput = document.getElementById("token");
    const statusBox = document.getElementById("status");
    const videos = document.getElementById("videos");

    const startLiveBtn = document.getElementById("startLiveBtn");
    const joinLiveBtn = document.getElementById("joinLiveBtn");
    const connectBtn = document.getElementById("connectBtn");
    const leaveBtn = document.getElementById("leaveBtn");
    const endLiveBtn = document.getElementById("endLiveBtn");

    let room = null;
    let localVideoCard = null;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    async function callApi(path, method = "GET", body = null) {
      const authToken = authTokenInput.value.trim();

      if (!authToken) {
        throw new Error("Backend JWT token is required.");
      }

      const response = await fetch(`${API_URL}${path}`, {
        method,
        headers: {
          Authorization: `Bearer ${authToken}`,
          ...(body ? { "Content-Type": "application/json" } : {})
        },
        ...(body ? { body: JSON.stringify(body) } : {})
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.message || `API request failed (${response.status})`);
      }

      return data;
    }

    function addRemoteTrack(track, participant) {
      const card = document.createElement("div");
      card.className = "video-card";

      const title = document.createElement("p");
      title.textContent = participant.identity;
      card.appendChild(title);

      const element = track.attach();

      if (track.kind === Track.Kind.Video) {
        element.autoplay = true;
        element.playsInline = true;
      }

      card.appendChild(element);
      videos.appendChild(card);

      track.__testCard = card;
    }

    function removeRemoteTrack(track) {
      track.detach().forEach(element => element.remove());
      track.__testCard?.remove();
      delete track.__testCard;
    }

    function renderExistingTracks() {
      if (!room) return;

      room.remoteParticipants.forEach(participant => {
        participant.trackPublications.forEach(publication => {
          if (publication.track) {
            addRemoteTrack(publication.track, participant);
          }
        });
      });
    }

    async function connectToRoom() {
      if (room) {
        setStatus("Already connected. Leave the current class first.");
        return;
      }

      const url = serverUrl.value.trim();
      const token = tokenInput.value.trim();

      if (!url || !token) {
        setStatus("Get access from the backend first.");
        return;
      }

      connectBtn.disabled = true;

      try {
        const newRoom = new Room();
        room = newRoom;

        newRoom.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
          addRemoteTrack(track, participant);
        });

        newRoom.on(RoomEvent.TrackUnsubscribed, track => {
          removeRemoteTrack(track);
        });

        newRoom.on(RoomEvent.Disconnected, () => {
          setStatus("Disconnected from LiveKit.");
        });

        await newRoom.connect(url, token);

        if (role.value === "INSTRUCTOR") {
          await newRoom.localParticipant.setCameraEnabled(true);
          await newRoom.localParticipant.setMicrophoneEnabled(true);

          localVideoCard = document.createElement("div");
          localVideoCard.className = "video-card";

          const title = document.createElement("p");
          title.textContent = "You (Instructor)";
          localVideoCard.appendChild(title);

          const video = document.createElement("video");
          video.autoplay = true;
          video.playsInline = true;
          video.muted = true;
          localVideoCard.appendChild(video);

          videos.prepend(localVideoCard);

          const camera = newRoom.localParticipant.getTrackPublication(Track.Source.Camera);

          if (camera?.track) {
            camera.track.attach(video);
          }
        }

        renderExistingTracks();

        setStatus(
          role.value === "INSTRUCTOR"
            ? "Instructor connected. Camera and microphone are active."
            : "Student connected. Receiving published class media."
        );

        leaveBtn.disabled = false;
      } catch (error) {
        console.error(error);

        if (room) {
          await room.disconnect().catch(() => {});
          room = null;
        }

        videos.replaceChildren();
        localVideoCard = null;
        setStatus("Connection failed: " + error.message);
      } finally {
        connectBtn.disabled = false;
      }
    }

    async function leaveRoom() {
      if (room) {
        const oldRoom = room;
        room = null;
        await oldRoom.disconnect();
      }

      videos.replaceChildren();
      localVideoCard = null;
      leaveBtn.disabled = true;
      setStatus("Disconnected from class.");
    }

    startLiveBtn.addEventListener("click", async () => {
      if (role.value !== "INSTRUCTOR") {
        setStatus("Select Instructor role first.");
        return;
      }

      try {
        startLiveBtn.disabled = true;

        const result = await callApi("/live-sessions", "POST", {
          courseId: courseIdInput.value.trim()
        });

        const data = result.data;

        sessionIdInput.value = data.session._id;
        serverUrl.value = data.liveKitUrl;
        tokenInput.value = data.token;

        setStatus("Live session created. Now click Connect Camera / Join Class.");
      } catch (error) {
        setStatus("Start Live failed: " + error.message);
      } finally {
        startLiveBtn.disabled = false;
      }
    });

    joinLiveBtn.addEventListener("click", async () => {
      if (role.value !== "STUDENT") {
        setStatus("Select Student role first.");
        return;
      }

      try {
        joinLiveBtn.disabled = true;

        const sessionId = sessionIdInput.value.trim();

        if (!sessionId) {
          throw new Error("Enter the instructor's session ID.");
        }

        const result = await callApi(
          `/live-sessions/${encodeURIComponent(sessionId)}/join`,
          "POST"
        );

        serverUrl.value = result.data.liveKitUrl;
        tokenInput.value = result.data.token;

        setStatus("Student access granted. Now click Connect Camera / Join Class.");
      } catch (error) {
        setStatus("Join access failed: " + error.message);
      } finally {
        joinLiveBtn.disabled = false;
      }
    });

    endLiveBtn.addEventListener("click", async () => {
      if (role.value !== "INSTRUCTOR") {
        setStatus("Only the instructor can end the live session.");
        return;
      }

      try {
        const sessionId = sessionIdInput.value.trim();

        if (!sessionId) {
          throw new Error("No session ID available.");
        }

        await callApi(
          `/live-sessions/${encodeURIComponent(sessionId)}/end`,
          "PATCH"
        );

        await leaveRoom();
        setStatus("Live session ended.");
      } catch (error) {
        setStatus("End Live failed: " + error.message);
      }
    });

    connectBtn.addEventListener("click", connectToRoom);
    leaveBtn.addEventListener("click", leaveRoom);

    role.addEventListener("change", () => {
      setStatus("Role selected: " + role.value);
    });
  </script>
</body>
</html>
