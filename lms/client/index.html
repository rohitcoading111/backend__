
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>LearnHub | Learn, Build, Grow</title>

    <meta
      name="description"
      content="LearnHub is a modern learning management platform. Explore courses, attend live classes, learn from expert instructors, and track your learning progress."
    />

    <meta
      name="keywords"
      content="LearnHub, LMS, online learning, online courses, live classes, learning management system, education platform"
    />

    <meta name="author" content="LearnHub" />
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark light" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Canonical: keep this after purchasing and connecting the domain -->
    <link rel="canonical" href="https://learnhubcloud.in/" />

    <!-- Open Graph: WhatsApp, LinkedIn, Facebook previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LearnHub" />
    <meta property="og:title" content="LearnHub | Learn, Build, Grow" />
    <meta
      property="og:description"
      content="Learn new skills, attend live classes, and track your learning journey with LearnHub."
    />
    <meta property="og:url" content="https://learnhubcloud.in/" />
    <meta
      property="og:image"
      content="https://learnhubcloud.in/og-image.png"
    />

    <!-- Twitter / X Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LearnHub | Learn, Build, Grow" />
    <meta
      name="twitter:description"
      content="Your learning journey starts here. Learn, build, and grow with LearnHub."
    />
    <meta
      name="twitter:image"
      content="https://learnhubcloud.in/og-image.png"
    />

    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
