<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title data-rh="true">LearnHub – Online Courses & Learning Platform</title>

    <meta
      name="description"
      content="Explore online courses on LearnHub. Discover expert-led courses, develop practical skills, attend live classes, and track your learning progress."
      data-rh="true"
    />

    <meta name="author" content="LearnHub" />
    <meta name="robots" content="index, follow" data-rh="true" />
    <meta name="theme-color" content="#09090b" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/favicon.png?v=2"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png?v=2"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://learnhubcloud.in/"
      data-rh="true"
    />

    <!-- Open Graph: WhatsApp, Facebook, LinkedIn -->
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:site_name" content="LearnHub" data-rh="true" />

    <meta
      property="og:title"
      content="LearnHub – Online Courses & Learning Platform"
      data-rh="true"
    />

    <meta
      property="og:description"
      content="Explore expert courses, attend live classes, track your learning progress, and develop practical skills with LearnHub."
      data-rh="true"
    />

    <meta
      property="og:url"
      content="https://learnhubcloud.in/"
      data-rh="true"
    />

    <meta
      property="og:image"
      content="https://learnhubcloud.in/og-banner.png"
      data-rh="true"
    />

    <meta
      property="og:image:secure_url"
      content="https://learnhubcloud.in/og-banner.png"
      data-rh="true"
    />

    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta
      property="og:image:alt"
      content="LearnHub - Online Learning Platform featuring live classes, expert courses and learning progress tracking."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" data-rh="true" />

    <meta
      name="twitter:title"
      content="LearnHub – Online Courses & Learning Platform"
      data-rh="true"
    />

    <meta
      name="twitter:description"
      content="Explore expert courses, attend live classes, and track your learning progress with LearnHub."
      data-rh="true"
    />

    <meta
      name="twitter:image"
      content="https://learnhubcloud.in/og-banner.png"
      data-rh="true"
    />

    <meta
      name="twitter:image:alt"
      content="LearnHub Online Learning Platform"
    />

    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
